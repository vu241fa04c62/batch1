<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwiftCheck | Aesthetic Attendance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: #020617;
            overflow-x: hidden;
        }

        /* --- Crazy Mesh Gradient Background --- */
        .mesh-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
            background: #020617;
        }

        .mesh-circle {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.5;
            animation: move 20s infinite alternate;
        }

        .c1 { width: 600px; height: 600px; background: #4f46e5; top: -10%; left: -10%; }
        .c2 { width: 500px; height: 500px; background: #7c3aed; bottom: -10%; right: -10%; animation-delay: -5s; }
        .c3 { width: 400px; height: 400px; background: #db2777; top: 40%; left: 30%; animation-delay: -10s; }

        @keyframes move {
            from { transform: translate(0, 0) scale(1); }
            to { transform: translate(100px, 100px) scale(1.2); }
        }

        /* --- Refined Glassmorphism --- */
        .glass-card { 
            background: rgba(255, 255, 255, 0.03); 
            backdrop-filter: blur(25px) saturate(180%); 
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .glass-input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-input:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: #6366f1;
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.15);
        }

        .btn-glow {
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .btn-glow::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
            transform: rotate(45deg);
            transition: 0.5s;
        }

        .btn-glow:hover::after {
            left: 100%;
        }

        .btn-glow:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 10px 30px -10px rgba(99, 102, 241, 0.5);
        }

        @keyframes slideIn { 
            from { opacity: 0; transform: translateY(30px) scale(0.95); } 
            to { opacity: 1; transform: translateY(0) scale(1); } 
        }
        .animate-slide { animation: slideIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.2); }
    </style>
</head>
<body class="text-slate-200 min-h-screen">

    <div class="mesh-bg">
        <div class="mesh-circle c1"></div>
        <div class="mesh-circle c2"></div>
        <div class="mesh-circle c3"></div>
    </div>

    <div id="app" class="p-4 md:p-10 max-w-7xl mx-auto">
        <!-- Login Section -->
        <div id="login-screen" class="min-h-[80vh] flex items-center justify-center">
            <div class="glass-card p-10 rounded-[2.5rem] w-full max-w-md animate-slide">
                <div class="flex flex-col items-center mb-10 text-center">
                    <div class="bg-indigo-500/10 p-5 rounded-3xl mb-6 ring-1 ring-indigo-500/20">
                        <i data-lucide="shield-check" class="w-12 h-12 text-indigo-400"></i>
                    </div>
                    <h1 class="text-4xl font-black text-white mb-3 tracking-tight">SwiftCheck</h1>
                    <p class="text-slate-400 text-sm font-medium">Aesthetic AI Attendance Portal</p>
                </div>

                <div class="space-y-6">
                    <div class="space-y-3">
                        <label class="text-xs font-bold text-slate-500 uppercase tracking-widest ml-1">Administrator Name</label>
                        <div class="relative group">
                            <i data-lucide="user" class="absolute left-5 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-500 group-focus-within:text-indigo-400 transition-colors"></i>
                            <input type="text" id="username-input" placeholder="Enter your name" 
                                class="w-full bg-white/5 border border-white/10 rounded-2xl py-4 pl-14 pr-6 outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500/40 transition-all text-white placeholder:text-slate-600">
                        </div>
                    </div>
                    <div class="space-y-3">
                        <label class="text-xs font-bold text-slate-500 uppercase tracking-widest ml-1">Secure Password</label>
                        <div class="relative group">
                            <i data-lucide="lock" class="absolute left-5 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-500 group-focus-within:text-indigo-400 transition-colors"></i>
                            <input type="password" id="password-input" placeholder="••••••••" 
                                class="w-full bg-white/5 border border-white/10 rounded-2xl py-4 pl-14 pr-6 outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500/40 transition-all text-white placeholder:text-slate-600">
                        </div>
                    </div>
                    <button onclick="handleLogin()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-5 rounded-2xl transition-all active:scale-95 flex items-center justify-center gap-3 btn-glow">
                        Access Dashboard <i data-lucide="arrow-right" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Dashboard Section (Hidden by Default) -->
        <div id="dashboard-screen" class="hidden animate-slide">
            <header class="flex flex-col md:flex-row md:items-center justify-between gap-6 mb-12">
                <div class="flex items-center gap-5">
                    <div class="bg-indigo-500 p-4 rounded-3xl shadow-lg shadow-indigo-500/20">
                        <i data-lucide="layout-grid" class="w-8 h-8 text-white"></i>
                    </div>
                    <div>
                        <h1 class="text-3xl font-black text-white tracking-tight">Portal Dashboard</h1>
                        <p class="text-slate-400 font-medium">Welcome back, <span id="display-name" class="text-indigo-400 font-bold underline underline-offset-4 decoration-indigo-500/30">User</span></p>
                    </div>
                </div>
                <div class="flex items-center gap-3">
                    <button onclick="exportCSV()" class="bg-white/5 hover:bg-white/10 border border-white/10 text-white px-6 py-3 rounded-2xl font-bold transition-all flex items-center gap-2">
                        <i data-lucide="download" class="w-5 h-5"></i> Export Data
                    </button>
                    <button onclick="location.reload()" class="bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 px-6 py-3 rounded-2xl font-bold transition-all flex items-center gap-2 border border-rose-500/10">
                        <i data-lucide="log-out" class="w-5 h-5"></i> Sign Out
                    </button>
                </div>
            </header>

            <div class="grid grid-cols-1 lg:grid-cols-12 gap-10">
                <!-- Camera Section -->
                <div class="lg:col-span-5 space-y-8">
                    <div class="glass-card rounded-[2.5rem] overflow-hidden relative group">
                        <div class="aspect-video relative overflow-hidden bg-slate-900 flex items-center justify-center">
                            <video id="video" autoplay playsinline class="w-full h-full object-cover hidden"></video>
                            <canvas id="canvas" class="hidden"></canvas>
                            <img id="photo-preview" class="w-full h-full object-cover hidden">
                            
                            <div id="camera-placeholder" class="flex flex-col items-center gap-4">
                                <div class="bg-slate-800 p-6 rounded-full border border-white/5">
                                    <i data-lucide="camera-off" class="w-10 h-10 text-slate-500"></i>
                                </div>
                                <p class="text-slate-500 font-bold uppercase tracking-widest text-xs">Lens is currently capped</p>
                            </div>

                            <div id="status-badge" class="absolute top-6 left-6 bg-slate-900/80 backdrop-blur-md px-4 py-2 rounded-full border border-white/10 flex items-center gap-2">
                                <span class="w-2 h-2 rounded-full bg-slate-500 animate-pulse" id="status-indicator"></span>
                                <span class="text-[10px] font-black uppercase tracking-widest text-slate-300" id="status-text">Ready to Initialize</span>
                            </div>
                        </div>
                    </div>

                    <div class="flex gap-4">
                        <button id="start-btn" onclick="startCamera()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-5 rounded-2xl transition-all active:scale-95 flex items-center justify-center gap-3 btn-glow">
                            <i data-lucide="power" class="w-5 h-5"></i> Initialize Lens
                        </button>
                        <button id="capture-btn" onclick="markAttendance()" class="hidden flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-5 rounded-2xl transition-all active:scale-95 flex items-center justify-center gap-3 shadow-lg shadow-emerald-500/20">
                            <i data-lucide="check-circle-2" class="w-5 h-5"></i> Confirm Entry
                        </button>
                    </div>
                </div>

                <!-- Activity Table -->
                <div class="lg:col-span-7">
                    <div class="glass-card rounded-[2.5rem] overflow-hidden border border-white/5">
                        <div class="p-8 border-b border-white/5 flex items-center justify-between bg-white/5">
                            <h3 class="text-xl font-black text-white">Live Attendance Stream</h3>
                            <span id="log-count" class="bg-indigo-500 text-white text-[10px] px-3 py-1 rounded-full font-black uppercase tracking-tighter shadow-lg shadow-indigo-500/30">
                                0 Sessions Recorded
                            </span>
                        </div>
                        <div class="max-h-[500px] overflow-y-auto">
                            <table class="w-full text-left">
                                <thead class="sticky top-0 bg-slate-900/90 backdrop-blur-md">
                                    <tr class="text-slate-500 text-[10px] font-black uppercase tracking-widest">
                                        <th class="px-8 py-5">Profile</th>
                                        <th class="px-8 py-5">Timeframe</th>
                                        <th class="px-8 py-5">Status</th>
                                        <th class="px-8 py-5">Action</th>
                                    </tr>
                                </thead>
                                <tbody id="logs-body" class="divide-y divide-white/5">
                                    <!-- Rows added dynamically -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentUser = "";
        let stream = null;
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const photoPreview = document.getElementById('photo-preview');

        function handleLogin() {
            const input = document.getElementById('username-input').value;
            const passInput = document.getElementById('password-input').value;

            if (!input.trim()) return alert("Identify yourself first.");
            if (!passInput.trim()) return alert("Password required for verification.");
            
            currentUser = input;
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('dashboard-screen').classList.remove('hidden');
            document.getElementById('display-name').innerText = currentUser;
            loadLogs();
            lucide.createIcons();
        }

        async function startCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
                video.classList.remove('hidden');
                document.getElementById('camera-placeholder').classList.add('hidden');
                document.getElementById('start-btn').classList.add('hidden');
                document.getElementById('capture-btn').classList.remove('hidden');
                
                document.getElementById('status-indicator').classList.remove('bg-slate-500');
                document.getElementById('status-indicator').classList.add('bg-emerald-500');
                document.getElementById('status-text').innerText = "Lens Active | AI Tracking";
            } catch (err) {
                alert("Camera access denied or unavailable.");
            }
        }

        async function markAttendance() {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            
            const imageData = canvas.toDataURL('image/png');
            const now = new Date();
            
            const record = {
                id: Date.now(),
                name: currentUser,
                date: now.toLocaleDateString(),
                time: now.toLocaleTimeString(),
                status: 'Verified',
                image: imageData
            };

            // Save to LocalStorage for immediate demo purposes
            saveLog(record);
            renderRow(record, true);
            
            // Try saving to MongoDB if backend is running
            try {
                await fetch('http://localhost:5000/api/attendance', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(record)
                });
            } catch (e) {
                console.log("Backend not detected, saved to local cache only.");
            }
        }

        function saveLog(record) {
            let logs = JSON.parse(localStorage.getItem('swiftcheck_logs') || '[]');
            logs.unshift(record);
            localStorage.setItem('swiftcheck_logs', JSON.stringify(logs));
            updateCount(logs.length);
        }

        function loadLogs() {
            let logs = JSON.parse(localStorage.getItem('swiftcheck_logs') || '[]');
            const body = document.getElementById('logs-body');
            body.innerHTML = "";
            logs.forEach(log => renderRow(log));
            updateCount(logs.length);
        }

        function renderRow(log, animate = false) {
            const body = document.getElementById('logs-body');
            const row = document.createElement('tr');
            row.className = `group hover:bg-white/5 transition-all ${animate ? 'animate-slide' : ''}`;
            row.innerHTML = `
                <td class="px-8 py-6">
                    <div class="flex items-center gap-4">
                        <img src="${log.image}" class="w-12 h-12 rounded-2xl object-cover ring-2 ring-white/10 group-hover:ring-indigo-500/50 transition-all">
                        <span class="font-bold text-white text-sm">${log.name}</span>
                    </div>
                </td>
                <td class="px-8 py-6">
                    <div class="space-y-1">
                        <div class="text-xs text-slate-300 font-bold uppercase tracking-wider">${log.date}</div>
                        <div class="text-[10px] text-slate-500 font-black">${log.time}</div>
                    </div>
                </td>
                <td class="px-8 py-6">
                    <span class="bg-emerald-500/10 text-emerald-400 text-[10px] font-black uppercase tracking-tighter px-3 py-1 rounded-full border border-emerald-500/20">
                        ${log.status}
                    </span>
                </td>
                <td class="px-8 py-6">
                    <button onclick="deleteLog(${log.id})" class="p-2 text-slate-600 hover:text-rose-400 transition-colors">
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                    </button>
                </td>
            `;
            if (animate) body.prepend(row); else body.appendChild(row);
            lucide.createIcons();
        }

        function deleteLog(id) {
            let logs = JSON.parse(localStorage.getItem('swiftcheck_logs') || '[]');
            logs = logs.filter(l => l.id !== id);
            localStorage.setItem('swiftcheck_logs', JSON.stringify(logs));
            loadLogs();
        }

        function updateCount(n) {
            document.getElementById('log-count').innerText = `${n} Sessions Recorded`;
        }

        function exportCSV() {
            let logs = JSON.parse(localStorage.getItem('swiftcheck_logs') || '[]');
            if (logs.length === 0) return alert("No data available.");
            let csv = "Name,Date,Time,Status\n" + logs.map(l => `${l.name},${l.date},${l.time},${l.status}`).join("\n");
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = "Attendance_Report.csv";
            a.click();
        }

        // Initialize Icons
        lucide.createIcons();
    </script>
</body>
</html>
